<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <style>
    text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif; }
    .eyebrow { font-size: 22px; font-weight: 700; fill: #5eead4; letter-spacing: 1px; }
    .wrong { font-size: 64px; font-weight: 800; fill: #64748b; text-decoration: line-through; }
    .right { font-size: 80px; font-weight: 800; fill: #ffffff; }
    .q { font-size: 30px; font-weight: 600; fill: #cbd5e1; }
    .book { font-size: 20px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="800" height="800" fill="#0f172a"/>

  <text x="70" y="130" class="eyebrow">이거 헷갈리시죠?</text>

  <text x="70" y="270" class="wrong">됬다</text>
  <text x="330" y="270" font-size="40" fill="#475569">vs</text>
  <text x="420" y="290" class="right">됐다</text>

  <text x="70" y="400" class="wrong">몇일</text>
  <text x="330" y="400" font-size="40" fill="#475569">vs</text>
  <text x="420" y="420" class="right">며칠</text>

  <text x="70" y="530" class="wrong">왠일</text>
  <text x="330" y="530" font-size="40" fill="#475569">vs</text>
  <text x="420" y="550" class="right">웬일</text>

  <text x="70" y="640" class="q">정답, 1초 안에 나오셨나요?</text>

  <rect x="70" y="670" width="300" height="56" rx="28" fill="#0d9488"/>
  <text x="220" y="706" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">하루 10분이면 정리 →</text>

  <text x="70" y="765" class="book">하루 10분, 헷갈리는 맞춤법 완전정복</text>
</svg>
